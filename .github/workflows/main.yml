name: Security Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. SAST - Bandit
      - name: Run Bandit (SAST)
        run: |
          bandit -r . -f txt -o bandit_report.txt || true
          cat bandit_report.txt

      # 2. Поднимаем приложение
      - name: Run Flask App in Background
        run: |
          python app.py &
          sleep 5

      # 3. DAST - OWASP ZAP Baseline Scan (Официальный Action)
      - name: ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:5000/api/users'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false

      # 4. Выгружаем Bandit отчет
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.txt
